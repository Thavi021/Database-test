<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
</head>
<body>

<h1>Supabase Test App</h1>

<input id="messageInput" placeholder="Type a message" />
<button onclick="addMessage()">Add</button>

<h2>Messages:</h2>
<ul id="messagesList"></ul>

<!-- ✅ FIXED SUPABASE SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ✅ DEBUG: Check script loaded
console.log("Supabase global:", window.supabase);

// ✅ YOUR KEYS
const SUPABASE_URL = "https://qhzyesapzldfufygaopz.supabase.co";
const SUPABASE_KEY = "YOUR_KEY_HERE"; // keep your real key

// ✅ Create client
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ Load messages
async function loadMessages() {
  console.log("Loading messages...");

  const { data, error } = await supabaseClient
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error("Load error:", error);
    return;
  }

  const list = document.getElementById('messagesList');
  list.innerHTML = "";

  data.forEach(msg => {
    const li = document.createElement('li');
    li.textContent = msg.text;
    list.appendChild(li);
  });
}

// ✅ Add message
async function addMessage() {
  console.log("Button clicked");

  const input = document.getElementById('messageInput');

  if (!input.value) return;

  const { data, error } = await supabaseClient
    .from('messages')
    .insert([{ text: input.value }]);

  if (error) {
    console.error("Insert error:", error);
    alert("Error inserting message. Check console.");
    return;
  }

  console.log("Insert success:", data);

  input.value = "";
  loadMessages();
}

// ✅ Initial load
loadMessages();

</script>

</body>
</html>
