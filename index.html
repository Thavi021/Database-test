<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
</head>
<body>

<h1>Supabase Test App</h1>

<input id="messageInput" placeholder="Type a message" />
<button onclick="addMessage()">Add</button>

<h2>Messages:</h2>
<ul id="messagesList"></ul>

<!-- ✅ CORRECT SUPABASE CDN (IMPORTANT) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ✅ DEBUG: confirm Supabase loaded
console.log("Supabase loaded:", window.supabase);

// ✅ YOUR SUPABASE DETAILS
const SUPABASE_URL = "https://qhzyesapzldfufygaopz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoenllc2FwemxkZnVmeWdhb3B6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzk5ODksImV4cCI6MjA5NTk1NTk4OX0.bm7LJs4cnfDOSU6pQiLWhUGgiSiHPpyvcmcylz1IzYY"; // keep your real key here

// ✅ Create Supabase client
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ Load messages from DB
async function loadMessages() {
  console.log("Loading messages...");

  const { data, error } = await supabaseClient
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error("Load error:", error);
    return;
  }

  const list = document.getElementById('messagesList');
  list.innerHTML = "";

  data.forEach(msg => {
    const li = document.createElement('li');
    li.textContent = msg.text;
    list.appendChild(li);
  });
}

// ✅ Insert new message into DB
async function addMessage() {
  console.log("Button clicked");

  const input = document.getElementById('messageInput');

  if (!input.value) return;

  const { data, error } = await supabaseClient
    .from('messages')
    .insert([{ text: input.value }]);

  console.log("Insert result:", data, error);

  if (error) {
    alert("Insert failed: " + error.message);
    console.error(error);
    return;
  }

  input.value = "";
  loadMessages();
}

// ✅ Initial load
loadMessages();
</script>

</body>
</html>
