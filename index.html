<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>

<body>

<h1>Supabase Test App</h1>

<input id="messageInput" placeholder="Type a message" />
<button onclick="addMessage()">Add</button>

<h2>Messages:</h2>
<ul id="messagesList"></ul>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "https://qhzyesapzldfufygaopz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoenllc2FwemxkZnVmeWdhb3B6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzk5ODksImV4cCI6MjA5NTk1NTk4OX0.bm7LJs4cnfDOSU6pQiLWhUGgiSiHPpyvcmcylz1IzYY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadMessages() {
  const { data } = await supabaseClient
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });

  const list = document.getElementById('messagesList');
  list.innerHTML = "";

  data.forEach(msg => {
    const li = document.createElement('li');
    li.textContent = msg.text;
    list.appendChild(li);
  });
}

async function addMessage() {
  const input = document.getElementById('messageInput');

  if (!input.value) return;

  await supabaseClient
    .from('messages')
    .insert([{ text: input.value }]);

  input.value = "";
  loadMessages();
}

loadMessages();
